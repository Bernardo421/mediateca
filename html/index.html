<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mediateca</title>
    <link rel="stylesheet" href="../css/estilo_login.css">
    <link rel="shortcut icon" href="../image/logo.png" type="image/x-icon">
</head>
<body>
<!-- Esqueleto do login -->
    <div class="login">
        <img src="../image/logo.png" alt="" width="100px" class="logo">
        <div class="input_grup">
            
            <input type="text" id="nome" name="nome" placeholder="">
            <label for="nome" class="seunome">Seu nome</label>
            <abbr title="Nome do utilizador"><img src="../image/perfil-de-usuario.png" alt="" width="20ppx"></abbr>
            
            <br>
        </div>
        <div class="input_grup">
            <input type="password" id="senha" name="senha" placeholder="" maxlength="16">
            <label for="senha" class="suasenha">Sua senha</label>
            <abbr title="Mostrar senha"><img src="../image/olho (1).png" alt="Olho fechado" width="20px" id="mudar_senha"></abbr>
            
        </div>
        <button class="botao">Enter</button>
        <a href="">Esqueci a senha</a>
    </div>
    <script src="../js/animacao_do_login.js"></script>
</body>
</html>
